# Middle-earth service example.
#
#   podman compose up -d --build
#
# Apache terminates TLS and serves static files. API requests are proxied to
# the Python backend. Secrets (the TLS cert/key pair) are bind-mounted
# read-only; they are never baked into an image.
#
# SVC_USER, SVC_UID, SVC_GID, and SVC_FQDN must be set in .env (written by
# init.sh from service.conf). There are no defaults; a missing .env will
# cause podman compose to fail.

services:
  apache:
    build:
      context: .
      dockerfile: Dockerfile.apache
      args:
        SVC_UID: "${SVC_UID}"
        SVC_GID: "${SVC_GID}"
        SVC_USER: "${SVC_USER}"
    image: middle-earth-example/apache:latest
    container_name: example-apache
    hostname: "${SVC_FQDN}"
    environment:
      SERVER_NAME: "${SVC_FQDN}"
    ports:
      - "443:443"
    restart: unless-stopped
    labels:
      idac.service: example-apache
    volumes:
      # TLS cert and key, generated by init.sh for dev or placed manually for
      # production. Bind-mounted read-only; never baked into the image.
      - "${SVC_CERT_DIR:-./certs}:/etc/httpd/certs:ro"
    depends_on:
      - app

  app:
    build:
      context: .
      dockerfile: Dockerfile.app
      args:
        SVC_UID: "${SVC_UID}"
        SVC_GID: "${SVC_GID}"
        SVC_USER: "${SVC_USER}"
    image: middle-earth-example/app:latest
    container_name: example-app
    restart: unless-stopped
    user: "${SVC_UID}:${SVC_GID}"
    labels:
      idac.service: example-app
    expose:
      - "8080"
