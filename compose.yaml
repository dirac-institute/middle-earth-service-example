# Middle-earth service example.
#
#   podman compose up -d --build
#
# Apache serves static files and proxies API requests to a Python backend,
# all in one container on port 8080. The VM's reverse proxy handles TLS
# termination and routes traffic here. A second container, `monitoring`,
# reports the VM's CPU, memory and disks on port 9110 for the gadget monitor.
#
# SVC_USER, SVC_UID, SVC_GID, and SVC_FQDN must be set in .env in production
# (written by init.sh from IT's /root/VM.set). There are no defaults; missing
# values will cause podman compose to fail.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SVC_UID: "${SVC_UID}"
        SVC_GID: "${SVC_GID}"
        SVC_USER: "${SVC_USER}"
    image: middle-earth-example/app:latest
    container_name: example-app
    hostname: "${SVC_FQDN}"
    environment:
      SERVER_NAME: "${SVC_FQDN}"
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped
    user: "${SVC_UID}:${SVC_GID}"
    labels:
      idac.service: example-app

  # CPU, memory and disks of this VM, for the gadget monitor (monitoring/README.md).
  # Copied unchanged from middle-earth-gadget-monitor; its settings live in
  # monitoring/compose.yaml. Serves http://<vm fqdn>:9110/metrics.
  monitoring:
    extends:
      file: monitoring/compose.yaml
      service: monitoring
    build: monitoring
    container_name: example-service-vm
    labels:
      idac.service: example-service-vm
