ServerName ${SERVER_NAME}

Listen 443

LoadModule ssl_module modules/mod_ssl.so
LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_http_module modules/mod_proxy_http.so

<VirtualHost *:443>
    ServerName ${SERVER_NAME}

    SSLEngine on
    SSLCertificateFile    /etc/httpd/certs/hostcert.pem
    SSLCertificateKeyFile /etc/httpd/certs/hostkey.pem

    DocumentRoot /srv/static

    <Directory /srv/static>
        Require all granted
    </Directory>

    # API requests are proxied to the Python backend.
    ProxyPass        /api/ http://app:8080/api/
    ProxyPassReverse /api/ http://app:8080/api/
</VirtualHost>
