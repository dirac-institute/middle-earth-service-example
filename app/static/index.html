<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Middle-earth Service Example</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 40em; margin: 2em auto; padding: 0 1em; }
    pre  { background: #f4f4f4; padding: 1em; border-radius: 4px; overflow-x: auto; }
    code { font-size: 0.95em; }
  </style>
</head>
<body>
  <h1>Middle-earth Service Example</h1>
  <p>This static page is served by Apache. The API endpoint below is proxied through Apache to a Python backend.</p>
  <h2>API</h2>
  <p>Try it: <a href="/api/hello"><code>GET /api/hello</code></a></p>
  <pre><code>curl -k https://localhost/api/hello</code></pre>
  <p id="result"></p>
  <script>
    fetch("/api/hello")
      .then(r => r.json())
      .then(d => { document.getElementById("result").textContent = "Response: " + JSON.stringify(d); })
      .catch(() => {});
  </script>
</body>
</html>
